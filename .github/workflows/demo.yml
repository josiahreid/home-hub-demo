# Builds the demo, checks it (in demo mode: sample data loads, every main page and its scripts load), publishes the
# image (public) and writes demo-stack.yml with the exact version to the `deploy` branch, which the server follows.
name: Demo

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: demo
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/josiahreid/home-hub-demo

jobs:
  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Which version
        id: v
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:${{ steps.v.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check it in demo mode
        run: |
          docker volume create demo-check
          docker run -d --name demo-check -p 3000:3000 -e HOSTNAME=0.0.0.0 -e HOME_HUB_DEMO=1 -v demo-check:/data "$IMAGE:${{ steps.v.outputs.tag }}"
          node scripts/smoke-test.mjs http://127.0.0.1:3000 || { docker logs demo-check; exit 1; }
          docker exec demo-check ls /data/demo-start-v2.db
          docker rm -f demo-check
      - name: Publish
        run: |
          docker tag "$IMAGE:${{ steps.v.outputs.tag }}" "$IMAGE:latest"
          docker push "$IMAGE:${{ steps.v.outputs.tag }}"
          docker push "$IMAGE:latest"
      - name: Send to the server (deploy branch)
        run: |
          TAG=${{ steps.v.outputs.tag }}
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch --depth 1 origin deploy; then git worktree add --detach ../deploy FETCH_HEAD; else git worktree add --orphan -b deploy-new ../deploy; fi
          sed "s#image: $IMAGE:latest#image: $IMAGE:$TAG#" demo-stack.yml > ../deploy/docker-compose.yml
          grep -q "image: $IMAGE:$TAG" ../deploy/docker-compose.yml
          cd ../deploy
          printf '# Home Hub demo – what the server runs\n\nWritten by the Demo workflow. Live version: **%s**\n' "$TAG" > README.md
          git add -A
          if git diff --cached --quiet; then echo "Already on $TAG."; else git commit -q -m "Deploy $TAG"; git push origin HEAD:refs/heads/deploy; fi
